{% extends "base.html" %}
{% block title %}Login — Fluent X{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to continue your progress.</p>
        <form method="POST" action="{{ url_for('login') }}" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
