{% extends "base.html" %}
{% block title %}Create Account — Fluent X{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-sub">Start your English fluency journey today.</p>
        <form method="POST" action="{{ url_for('register') }}" novalidate>
            <div class="form-group">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Jane Doe" value="{{ full_name or '' }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                <span class="field-hint">Minimum 6 characters</span>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
